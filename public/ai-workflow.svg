<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wfGlow" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0a0a0f"/>
  <rect width="1200" height="900" fill="url(#wfGlow)"/>

  <!-- dashboard panel -->
  <rect x="150" y="150" width="900" height="600" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
  <line x1="150" y1="232" x2="1050" y2="232" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="196" cy="191" r="7" fill="#ff6a3d"/>
  <circle cx="222" cy="191" r="7" fill="#7c5cff"/>
  <circle cx="248" cy="191" r="7" fill="#22d3ee"/>
  <rect x="300" y="184" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.18"/>

  <!-- bar chart -->
  <g>
    <rect x="210" y="520" width="60" height="150" rx="10" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="300" y="450" width="60" height="220" rx="10" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="390" y="380" width="60" height="290" rx="10" fill="url(#wfAccent)"/>
    <rect x="480" y="320" width="60" height="350" rx="10" fill="url(#wfAccent)"/>
    <rect x="570" y="270" width="60" height="400" rx="10" fill="#22d3ee" fill-opacity="0.85"/>
  </g>

  <!-- trend line -->
  <polyline points="210,560 300,500 390,460 480,400 570,330 690,300" fill="none" stroke="#f5f3ee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="690" cy="300" r="8" fill="#f5f3ee"/>

  <!-- side stat cards -->
  <g>
    <rect x="740" y="280" width="250" height="100" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="766" y="306" width="120" height="16" rx="8" fill="#ff6a3d" fill-opacity="0.8"/>
    <rect x="766" y="338" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.15"/>

    <rect x="740" y="400" width="250" height="100" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="766" y="426" width="120" height="16" rx="8" fill="#7c5cff" fill-opacity="0.85"/>
    <rect x="766" y="458" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.15"/>

    <rect x="740" y="520" width="250" height="100" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="766" y="546" width="120" height="16" rx="8" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="766" y="578" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.15"/>
  </g>
</svg>
